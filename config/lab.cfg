# Settings of the validation laboratory. Every line is optional; a missing line keeps the conservative default shown here.

# Fewest copies of a golden set that must agree with its manifest.
min_copies = 2
# A file in a copy that the manifest does not list is a failure unless this is true.
allow_extra_files = false
# Bounds on what is read.
max_entries = 100000
max_path_bytes = 240
max_manifest_bytes = 67108864
max_results_bytes = 67108864
# Text mixed into the hash that stands for a case name in reports. Keep it out of the repository.
report_salt =
# The gate also fails when a case that passed before fails now, or when a baseline case is missing.
fail_on_new_failure = true
fail_on_missing_case = true
