[package]
name = "eh3d-validation-lab"
version = "0.0.2"
edition = "2021"
rust-version = "1.88"
description = "Test environment of the PHOENIX family: golden-file manifests with redundant copies, classified failures and a gate that a measured rate never drops"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-VALIDATION-LAB"
readme = "README.md"

[lib]
name = "eh3d_validation_lab"
path = "src/lib.rs"

[[bin]]
name = "eh3d-validation-lab"
path = "src/main.rs"

[dependencies]
# sha2: the SHA-256 of every golden file (the same crate EH3D-COMMON uses for its packages)
sha2 = "0.10"
# serde / serde_json: the baseline and the reports are plain JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
